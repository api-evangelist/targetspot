  reason: customer-only-docs
  detail: >-
    Targetspot markets a Passport reporting API on its product page but publishes
    no reference for it anywhere — the only route to the contract is a tenant login
    at passport.targetspot.com, whose server answers 200 with the same JavaScript
    app shell for every path including ones that cannot exist, while the API host
    api.targetspot.com resolves in DNS and then refuses TCP on 80 and 443.
