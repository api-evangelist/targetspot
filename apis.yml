name: Targetspot
description: >-
  Targetspot is a global digital-audio advertising (AdTech) company founded in
  2007 and headquartered in New York, connecting brands with audiences across
  podcasts, online radio, streaming, in-video audio, mobile gaming, and
  in-home/out-of-home audio. Its Passport product is a self-serve ad-serving
  platform for publishers and advertisers, with granular reporting data made
  available via a partner API, and Targetplay extends audio advertising into
  gaming and in-app inventory. Targetspot is now part of the Azerion platform.
  This profile originated as a Union Square Ventures portfolio lead and has been
  enriched from public web probes.
